rules:
  # 1. Dynamic code execution
  - id: javascript-no-dynamic-code
    message: Avoid dynamic code execution in JavaScript and TypeScript.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  # 2. Weak hash algorithms
  - id: node-weak-hash-algorithm
    message: Avoid weak hashing algorithms such as md5 and sha1.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: createHash('md5')
      - pattern: createHash("md5")
      - pattern: createHash('sha1')
      - pattern: createHash("sha1")

  # 3. Insecure randomness
  - id: node-insecure-random
    message: Use of insecure random number generator (Math.random). Prefer crypto.randomBytes for secrets.
    severity: WARNING
    languages: [javascript, typescript]
    pattern: Math.random(...)

  # 4. Insecure HTTP usage
  - id: insecure-http
    message: Detected use of insecure HTTP protocol. Prefer HTTPS for sensitive data.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: fetch('http://...')
      - pattern: axios.get('http://...')
      - pattern: axios.post('http://...')

  # 5. Disabled certificate validation
  - id: disabled-cert-validation
    message: Disabling TLS certificate validation is dangerous.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0

  # 6. Weak crypto algorithms
  - id: node-weak-crypto
    message: Avoid weak/blocklisted crypto algorithms (DES, RC4, etc).
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: createCipher('des')
      - pattern: createCipheriv('des', ...)
      - pattern: createCipher('rc4')
      - pattern: createCipheriv('rc4', ...)

  # 7. Command injection (child_process)
  - id: possible-command-injection
    message: Possible command injection - avoid passing user-controlled input to exec/execSync.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: exec($CMD)
      - pattern: execSync($CMD)

  # 8. Hardcoded password variable
  - id: hardcoded-password-var
    message: Possible hardcoded password or secret in variable assignment.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: const password = "..."
      - pattern: const secret = "..."
      - pattern: const apiKey = "..."
      - pattern: const token = "..."
      - pattern: const PASSWORD = "..."
      - pattern: const SECRET = "..."
      - pattern: const API_KEY = "..."
      - pattern: const TOKEN = "..."
