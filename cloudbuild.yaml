substitutions:
  _SERVICE_NAME: portfolio-web
  _REGION: us-central1
  _AR_REGION: us-central1
  _AR_REPOSITORY: portfolio-images
  _IMAGE_NAME: portfolio-web
  _PORTFOLIO_AGENT_BASE_URL: "https://portfolio-agent-399951936554.us-central1.run.app"
  _AGENT_SERVICE_NAME: portfolio-agent
  _AGENT_REQUEST_TIMEOUT_MS: "30000"
  _PORTFOLIO_WEB_BASE_URL: "https://portfolio.caldasdev.store"
  _PORTFOLIO_WEB_SA: portfolio-web
  _CONTACT_FROM_EMAIL: contato@caldasdev.store
  _CONTACT_TO_EMAIL: lucastere10@gmail.com

steps:
  - id: validate-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - scripts/cloudbuild/validate-config.sh
      - ${_PORTFOLIO_AGENT_BASE_URL}
      - ${_AGENT_SERVICE_NAME}
      - ${_REGION}

  - id: Build image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest
      - .

  - id: Push image sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA

  - id: Push image latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest

  - id: Deploy to Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account=${_PORTFOLIO_WEB_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --port
      - "8080"
      - --set-env-vars=PORTFOLIO_AGENT_BASE_URL=${_PORTFOLIO_AGENT_BASE_URL},AGENT_REQUEST_TIMEOUT_MS=${_AGENT_REQUEST_TIMEOUT_MS},PORTFOLIO_WEB_BASE_URL=${_PORTFOLIO_WEB_BASE_URL},CONTACT_FROM_EMAIL=${_CONTACT_FROM_EMAIL},CONTACT_TO_EMAIL=${_CONTACT_TO_EMAIL}
      - --set-secrets=RESEND_API_KEY=RESEND_API_KEY:latest

  - id: verify-run-env
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - scripts/cloudbuild/verify-run-env.sh
      - ${_SERVICE_NAME}
      - ${_REGION}

  - id: verify-communication
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - scripts/cloudbuild/verify-agent-health.sh
      - ${_PORTFOLIO_AGENT_BASE_URL}
      - ${_PORTFOLIO_WEB_SA}@$PROJECT_ID.iam.gserviceaccount.com

images:
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
