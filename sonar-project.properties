# ============================================================
# SonarQube — Frontend Next.js / React / TypeScript
# Padrão Neki: projectKey = nome do repositório
# ============================================================

sonar.projectKey=portfolio
sonar.projectName=portfolio

# TypeScript config dedicada ao Sonar (excluir next.config, etc.)
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Fontes e testes
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusões de cobertura
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  src/types/**/*,\
  **/*.d.ts

# Encoding
sonar.sourceEncoding=UTF-8
